services:
  couchdb:
    image: couchdb:3.5.2.1
    environment:
      COUCHDB_USER: ${COUCHDB_USERNAME:?Set COUCHDB_USERNAME in the environment}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Set COUCHDB_PASSWORD in the environment}
    ports:
      - "127.0.0.1:5984:5984"
    volumes:
      - face-intel-couch:/opt/couchdb/data
      - ./deploy/single-node.ini:/opt/couchdb/etc/local.d/face-intel.ini:ro

volumes:
  face-intel-couch:
